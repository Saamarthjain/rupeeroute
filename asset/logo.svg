<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="routeGradient" x1="12" y1="88" x2="88" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <path d="M40 2C16.8 2 8 10.8 8 34C8 62 26 82 40 86C54 82 72 62 72 34C72 10.8 63.2 2 40 2Z" 
          fill="#1E293B" 
          stroke="#334155" 
          stroke-width="2" />

    <path d="M26 68C32 68 31 52 40 52C49 52 48 36 54 36" 
          stroke="url(#routeGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <path d="M22 24H52" 
          stroke="url(#routeGradient)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <path d="M22 36H44" 
          stroke="url(#routeGradient)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <path d="M48 24L60 24L60 36" 
          stroke="url(#routeGradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="60" cy="24" r="3" fill="#FFFFFF" />
  </g>

  <g transform="translate(105, 0)">
    <text x="0" y="58" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="38" 
          font-weight="800" 
          letter-spacing="-1px">Rupee</text>
          
    <text x="118" y="58" 
          fill="#10B981" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="38" 
          font-weight="800" 
          letter-spacing="-1px">Route</text>

    <text x="2" y="80" 
          fill="#64748B" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="1.5px" 
          text-transform="uppercase">Cross-Border Capital Routing</text>
  </g>
</svg>
